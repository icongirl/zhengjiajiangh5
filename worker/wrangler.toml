# ============================================================
# 郑家匠订单后端 - Cloudflare Worker 配置
# ============================================================
name = "zhengjiajiang-orders"
main = "index.js"
compatibility_date = "2024-09-01"

# KV 命名空间绑定（存储订单数据）
# 首次部署前执行：
#   wrangler kv namespace create ZJJ_ORDERS
# 然后把下面的 id 替换为实际命名空间 ID
[[kv_namespaces]]
binding = "ZJJ_ORDERS"
id = "YOUR_KV_NAMESPACE_ID"

# 环境变量（可选）：商家口令、微信支付密钥
[vars]
MERCHANT_TOKEN = "zjj2024admin"

# 微信支付密钥（如需真实收款，通过 wrangler secret 注入，勿明文写入）
# wrangler secret put WX_PAY_KEY
